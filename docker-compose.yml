version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mf_postgres
    environment:
      POSTGRES_USER: mf_user
      POSTGRES_PASSWORD: mf_password
      POSTGRES_DB: milieu_familial
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mf_user -d milieu_familial']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mf_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: mf_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mf_minio_user
      MINIO_ROOT_PASSWORD: mf_minio_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
